backend:
  name: github
  repo: hey-frnk/groundsquirrel-cafe
  branch: main
  # PLATZHALTER: URL eures OAuth-Proxys (siehe README, Abschnitt "CMS einrichten")
  base_url: https://YOUR-OAUTH-PROXY.netlify.app
  auth_endpoint: auth

# Bilder, die ihr im CMS hochladet, landen hier und sind danach unter /images/uploads/... erreichbar
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "journal"
    label: "Journal"
    label_singular: "Journal-Eintrag"
    folder: "content/journal"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Autor:in", name: "author", widget: "string" }
      - { label: "Kurzbeschreibung", name: "excerpt", widget: "text" }
      - { label: "Titelbild", name: "cover", widget: "image" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Inhalt", name: "body", widget: "markdown" }

  - name: "shop"
    label: "Shop"
    label_singular: "Produkt"
    folder: "content/shop"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Produktname", name: "title", widget: "string" }
      - label: "Kurzbeschreibung (ein Satz, unter dem Titel)"
        name: "tagline"
        widget: "string"
        required: false
      - { label: "Vorschaubild (für die Shop-Übersicht)", name: "image", widget: "image" }
      - { label: "Reihenfolge", name: "order", widget: "number", default: 1 }
      - label: "Auszeichnungen (kleine Etiketten)"
        name: "badges"
        widget: "list"
        required: false
        hint: "Kurze Etiketten unter dem Titel, z.B. '10% funds wildlife conservation'"
      - label: "Bildergalerie (falls eine Variante keine eigenen Bilder hat)"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Bild", name: "image", widget: "image" }
      - label: "Details ('Field notes'-Kasten)"
        name: "specs"
        widget: "list"
        required: false
        fields:
          - { label: "Bezeichnung", name: "label", widget: "string", hint: "z.B. Size" }
          - { label: "Angabe", name: "value", widget: "string", hint: "z.B. A3 — 29.7 × 42 cm" }
      - label: "Versandhinweis"
        name: "shippingNote"
        widget: "text"
        required: false
      - label: "Auswahl-Achsen (mehrere Dropdowns statt einem)"
        name: "optionAxes"
        widget: "list"
        required: false
        hint: "Leer lassen = ein einziges Dropdown mit allen Varianten. Gefüllt = je Achse ein eigenes Dropdown (z.B. Design / Size / Language). Jede Variante muss dann unten passende Werte tragen."
        fields:
          - { label: "Kennung", name: "id", widget: "string", hint: "z.B. size" }
          - { label: "Beschriftung", name: "label", widget: "string", hint: "z.B. Size" }
      - label: "Varianten (Set / einzelne Designs)"
        name: "variants"
        widget: "list"
        hint: "Jede Variante ist ein eigener Stripe-Artikel mit eigenem Preis und eigener Artikelnummer."
        fields:
          - { label: "Bezeichnung (im Dropdown)", name: "label", widget: "string" }
          - label: "Versandprofil"
            name: "shippingProfile"
            widget: "select"
            options: ["stickers", "postcards", "print-a5", "print-a4", "print-a3"]
            hint: "Bestimmt das Porto. Die Beträge stehen in content/shipping.json."
          - label: "Achsenwerte (nur bei mehreren Dropdowns)"
            name: "options"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "Design", name: "design", widget: "string", required: false }
              - { label: "Size", name: "size", widget: "string", required: false }
              - { label: "Language", name: "language", widget: "string", required: false }
          - label: "Preis in CHF"
            name: "price"
            widget: "number"
            value_type: "float"
            hint: "Nur die Zahl, z.B. 25 oder 12.50 — ohne 'CHF'."
          - { label: "Kurznotiz (kursiv unter der Auswahl)", name: "note", widget: "string", required: false }
          - label: "Bilder dieser Variante"
            name: "images"
            widget: "list"
            required: false
            field: { label: "Bild", name: "image", widget: "image" }
          - { label: "Artikelnummer (SKU)", name: "sku", widget: "string", required: false }
          - label: "Stripe Price ID"
            name: "stripePriceId"
            widget: "string"
            required: false
            hint: "Aus dem Stripe-Dashboard, beginnt mit 'price_'. Solange leer, zeigt der Warenkorb 'Checkout opens soon'."
      - { label: "Beschreibung / Geschichte", name: "body", widget: "markdown", required: false }

  - name: "crew"
    label: "Crew"
    label_singular: "Crew-Mitglied"
    folder: "content/crew"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Rolle", name: "role", widget: "string" }
      - { label: "Foto", name: "photo", widget: "image" }
      - label: "Weitere Fotos (optional, werden untereinander gezeigt statt des einzelnen runden Fotos)"
        name: "photos"
        widget: "list"
        field: { label: "Foto", name: "image", widget: "image" }
        required: false
      - { label: "Reihenfolge", name: "order", widget: "number" }
      - { label: "Spirit Animal", name: "spiritAnimal", widget: "string", required: false }
      - { label: "Inspiriert von", name: "inspiredBy", widget: "string", required: false }
      - { label: "Tätigkeitsfelder", name: "fieldOfWork", widget: "list", required: false }
      - { label: "Qualifikationen", name: "qualifications", widget: "list", required: false }
      - { label: "Bio", name: "body", widget: "markdown" }

  - name: "collabs"
    label: "Kooperationen"
    label_singular: "Kooperation"
    folder: "content/collabs"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Partner / Marke", name: "partner", widget: "string" }
      - { label: "Titel", name: "title", widget: "string", hint: "Wie ihr die Zusammenarbeit nennt, z.B. «A campfire session with the Grillspiess»" }
      - { label: "Format", name: "format", widget: "string", required: false, hint: "z.B. «Produkt im Café» oder «Campfire Session»" }
      - { label: "Jahr", name: "year", widget: "string", required: false }
      - { label: "Bild", name: "image", widget: "image", hint: "Solange kein Bild da ist, bleibt der Platzhalter stehen." }
      - { label: "Bildbeschreibung", name: "imageAlt", widget: "string", required: false }
      - label: "Weitere Fotos (bis zu 3)"
        name: "photos"
        widget: "list"
        required: false
        fields:
          - { label: "Foto", name: "image", widget: "image" }
          - { label: "Bildbeschreibung", name: "caption", widget: "string", required: false }
      - { label: "Link (Reel, Post, Partnerseite)", name: "link", widget: "string", required: false, hint: "Leer lassen = kein Link-Button." }
      - { label: "Reihenfolge", name: "order", widget: "number", default: 1 }
      - { label: "Beschreibung", name: "body", widget: "markdown" }

  - name: "tour-stops"
    label: "Tour Stopps"
    label_singular: "Stopp"
    folder: "content/tour-stops"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Land", name: "country", widget: "string", hint: "Grosse Überschrift, z.B. Schweden" }
      - { label: "Ort", name: "place", widget: "string", required: false, hint: "z.B. Furka Pass — steht klein unter dem Land" }
      - { label: "Kurzzeile", name: "tagline", widget: "string", required: false, hint: "Ein poetischer Halbsatz, z.B. «Rentiere waren unsere ersten Gäste»" }
      - { label: "Das gab es", name: "treat", widget: "string", required: false, hint: "z.B. Jordgubbstårta — erscheint als kleines Schildchen" }
      - { label: "Hauptfoto", name: "photo", widget: "image" }
      - label: "Weitere Fotos (bis zu 3)"
        name: "photos"
        widget: "list"
        required: false
        fields:
          - { label: "Foto", name: "image", widget: "image" }
          - { label: "Bildunterschrift", name: "caption", widget: "string", required: false }
      - { label: "Reihenfolge", name: "order", widget: "number" }
      - { label: "Beschreibung", name: "body", widget: "markdown" }

  - name: "studio-portfolio"
    label: "Studio: Portfolio"
    label_singular: "Werk"
    folder: "content/studio-portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Bild", name: "image", widget: "image" }
      - { label: "Reihenfolge", name: "order", widget: "number" }
      - { label: "Beschreibung", name: "body", widget: "markdown", required: false }

  - name: "studio-projects"
    label: "Studio: Projekte & Veröffentlichungen"
    label_singular: "Projekt"
    folder: "content/studio-projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Untertitel", name: "subtitle", widget: "string", required: false, hint: "Kursive Zeile unter dem Titel" }
      - label: "Art des Projekts"
        name: "kind"
        widget: "string"
        required: false
        hint: "Kleines Etikett auf der Karte, z.B. «Buch» oder «Lehrmittel»"
      - label: "Status"
        name: "status"
        widget: "string"
        required: false
        hint: "z.B. «Veröffentlichung: September 2026» oder «Work in progress»"
      - label: "Titelbild"
        name: "image"
        widget: "image"
        required: false
        hint: "Leer lassen, solange es noch kein Bild gibt — die Karte zeigt dann «Bilder folgen»."
      - label: "Kurztext (auf der Karte)"
        name: "teaser"
        widget: "text"
        required: false
      - label: "Verfügbarkeit"
        name: "availability"
        widget: "string"
        required: false
        hint: "Kleine Zeile unter den Buttons, z.B. «In der Schweiz, Deutschland und in Österreich erhältlich.»"
      - label: "Buttons"
        name: "links"
        widget: "list"
        required: false
        fields:
          - { label: "Beschriftung", name: "label", widget: "string", hint: "z.B. Hier geht's zum Buch" }
          - { label: "Link", name: "url", widget: "string", hint: "Ganze Adresse, oder «/shop» für den eigenen Shop" }
      - label: "Bilderreihe (Illustrationen & Erarbeitungen)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Bild", name: "image", widget: "image" }
          - { label: "Bildunterschrift", name: "caption", widget: "string", required: false }
      - label: "Hinweis zur Bilderreihe"
        name: "galleryNote"
        widget: "string"
        required: false
        hint: "Steht über der Bilderreihe — oder an ihrer Stelle, solange sie leer ist."
      - label: "Hinweis zu weiteren Infos"
        name: "infoNote"
        widget: "string"
        required: false
        hint: "z.B. «Nähere Infos folgen.»"
      - { label: "Reihenfolge", name: "order", widget: "number" }
      - { label: "Beschreibung", name: "body", widget: "markdown", required: false }

  - name: "studio-teaching"
    label: "Studio: Unterrichtsmaterial"
    label_singular: "Material"
    folder: "content/studio-teaching"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Bild", name: "image", widget: "image" }
      - { label: "Eduki-Link", name: "edukiLink", widget: "string", required: false }
      - { label: "Reihenfolge", name: "order", widget: "number" }
      - { label: "Beschreibung", name: "body", widget: "markdown", required: false }

  - name: "pages"
    label: "Seiten & Einstellungen"
    files:
      - name: "settings"
        label: "Website-Einstellungen"
        file: "content/pages/settings.md"
        fields:
          - { label: "Tagline (Startseite)", name: "tagline", widget: "string" }
          - { label: "Kontakt-E-Mail", name: "contactEmail", widget: "string" }
          - { label: "Instagram-Link", name: "instagramUrl", widget: "string", required: false }
          - { label: "YouTube-Link", name: "youtubeUrl", widget: "string", required: false }
          - { label: "TikTok-Link", name: "tiktokUrl", widget: "string", required: false }

      - name: "home"
        label: "Startseite"
        file: "content/pages/home.md"
        fields:
          - { label: "Seitentitel (intern)", name: "title", widget: "string" }
          - { label: "Kleine Zeile über dem Titel", name: "heroKicker", widget: "string" }
          - label: "Grosse Überschrift (Hero)"
            name: "heroHeadline"
            widget: "string"
            hint: "Für einen Zeilenumbruch <br> einfügen, z.B. «Come in,<br>coffee's ready»"
          - { label: "Überschrift «Wer wir sind»", name: "welcomeHeading", widget: "string" }
          - { label: "Text «Wer wir sind»", name: "welcomeText", widget: "text" }
          - { label: "Bildzeile über dem Kaffeefoto", name: "bandCaption", widget: "string" }
          - { label: "Überschrift Studio-Abschnitt", name: "studioHeading", widget: "string" }
          - {
              label: "Text Studio-Abschnitt",
              name: "studioText",
              widget: "text",
              hint: "Eine Leerzeile bzw. ein Zeilenumbruch beginnt einen neuen Absatz.",
            }
          - { label: "Überschrift Schluss-Abschnitt", name: "closingHeading", widget: "string" }
          - { label: "Text Schluss-Abschnitt", name: "closingText", widget: "text" }

      - name: "tour_intro"
        label: "Tour: Einleitung & CTA"
        file: "content/pages/tour-intro.md"
        fields:
          - { label: "Seitentitel", name: "title", widget: "string" }
          - { label: "Grosse Überschrift (Hero)", name: "heroHeadline", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }

          - { label: "Kooperationen: Kleine Zeile", name: "collabKicker", widget: "string" }
          - { label: "Kooperationen: Überschrift", name: "collabHeading", widget: "string" }
          - label: "Kooperationen: Die drei Blöcke"
            name: "pillars"
            widget: "list"
            hint: "Drei Abschnitte mit je einem Foto. Die Fotos stehen im Code und folgen der Reihenfolge: Humbär, Gebäck, Kaffee."
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

          - { label: "Referenzen: Kleine Zeile", name: "casesKicker", widget: "string" }
          - { label: "Referenzen: Überschrift", name: "casesHeading", widget: "string" }

          - { label: "Reichweite: Überschrift", name: "reachHeading", widget: "string" }
          - label: "Reichweite: Zahlen"
            name: "reach"
            widget: "list"
            required: false
            hint: "Zeilen mit «[PLATZHALTER…]» werden auf der Website ausgeblendet — einfach den echten Wert eintragen, dann erscheinen sie."
            fields:
              - { label: "Zahl", name: "value", widget: "string", hint: "z.B. 470,500 oder +89% oder 8.3%" }
              - { label: "Bezeichnung", name: "label", widget: "string" }
              - { label: "Zusatz (klein darunter)", name: "note", widget: "string", required: false, hint: "z.B. «last 30 days»" }
              - { label: "Hervorheben", name: "accent", widget: "boolean", required: false, default: false, hint: "Setzt einen rosa Strich über die Zahl. Am besten nur bei einer Kachel." }

          - { label: "Publikum: Überschrift", name: "audienceHeading", widget: "string", required: false }
          - label: "Publikum: Länder"
            name: "audience"
            widget: "list"
            required: false
            hint: "Die Balken werden relativ zum grössten Wert gezeichnet, die Prozentzahl steht daneben."
            fields:
              - { label: "Land", name: "label", widget: "string" }
              - { label: "Prozent", name: "percent", widget: "number", value_type: "float" }
          - label: "Publikum: Eckwerte"
            name: "audienceFacts"
            widget: "list"
            required: false
            hint: "Kurze Zahl-Label-Paare neben den Länderbalken, z.B. «40%» / «Germany & Switzerland»."
            fields:
              - { label: "Zahl", name: "value", widget: "string" }
              - { label: "Bezeichnung", name: "label", widget: "string" }
          - { label: "Reichweite: Fussnote", name: "reachNote", widget: "text", required: false }

          - { label: "Ablauf: Überschrift", name: "stepsHeading", widget: "string" }
          - { label: "Ablauf: Hinweis unter den Schritten", name: "stepsNote", widget: "text", required: false }

          - { label: "Buchung: Überschrift", name: "bookingHeading", widget: "string" }
          - { label: "Buchung: Text", name: "bookingText", widget: "text" }

          - { label: "CTA-Überschrift", name: "ctaHeading", widget: "string" }
          - { label: "CTA-Text", name: "ctaText", widget: "text" }
          - { label: "CTA-E-Mail", name: "ctaEmail", widget: "string" }

      - name: "studio_intro"
        label: "Studio: Einleitung"
        file: "content/pages/studio-intro.md"
        fields:
          - { label: "Seitentitel", name: "title", widget: "string" }
          - { label: "Kleine Zeile über dem Logo", name: "kicker", widget: "string", hint: "z.B. «welcome to»" }
          - { label: "Untertitel", name: "subtitle", widget: "string", required: false, hint: "z.B. «evelyne's creative space»" }
          - { label: "Einleitungstext (kurz)", name: "intro", widget: "text" }
          - { label: "Ziel des Shop-Buttons", name: "shopUrl", widget: "string", hint: "«/shop» für den eigenen Shop, oder eine ganze Adresse" }
          - { label: "Beschriftung des Shop-Buttons", name: "shopLabel", widget: "string" }
          - { label: "Zeile unter «art portfolio»", name: "portfolioNote", widget: "string", required: false }
          - { label: "Eduki-Account-Link", name: "edukiUrl", widget: "string", required: false }
          - label: "Text unter «unterrichtsmaterial»"
            name: "teachingNote"
            widget: "string"
            required: false
            hint: "Wird gezeigt, solange es noch kein Unterrichtsmaterial gibt."
          - { label: "Bio-Text (länger, unter der Einleitung)", name: "body", widget: "markdown" }

      - name: "impressum"
        label: "Impressum"
        file: "content/pages/impressum.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Inhalt", name: "body", widget: "markdown" }

      - name: "datenschutz"
        label: "Datenschutz"
        file: "content/pages/datenschutz.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Inhalt", name: "body", widget: "markdown" }
